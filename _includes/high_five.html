<section class="high-five" aria-labelledby="high-five-title">
  <h4 id="high-five-title">Enjoyed your visit?</h4>
  <p>Send a little high-five my way!</p>
  <button class="high-five__button" id="high-five-button" type="button" aria-describedby="high-five-status">
    <span class="high-five__emoji" aria-hidden="true">✋</span>
    <span class="high-five__label">Give me a high-five</span>
  </button>
  <p class="high-five__status" id="high-five-status" role="status" aria-live="polite">Your turn! 👋</p>
  <div class="high-five__bursts" id="high-five-bursts" aria-hidden="true"></div>
</section>
